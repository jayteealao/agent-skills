name: sdlc-workflow gates

# `gates` runs the unit suite and the release gates (versions, host-neutrality,
# drift, surface, docs) on every change under the plugin or either root
# catalog. The plugin runs from its source with no dependencies, so there is no
# build to check and no install step.
on:
  pull_request:
    paths:
      - 'plugins/sdlc-workflow/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - '.github/workflows/sdlc-gates.yml'
  push:
    branches: [master, main]
    paths:
      - 'plugins/sdlc-workflow/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - '.github/workflows/sdlc-gates.yml'

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/sdlc-workflow
    steps:
      - uses: actions/checkout@v4
        with:
          # verify-host-neutrality compares the burndown allowlist against the
          # origin/master merge base; a full history makes that comparison real.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit suite
        run: npm test
      - name: Release gates
        run: |
          npm run verify:versions
          npm run verify:neutrality
          npm run lint:drift
          npm run verify:surface
          npm run verify:docs
