<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design canvas</title>
<link rel="stylesheet" href="/canvas/canvas.css">
</head>
<body>
<header class="bar">
  <h1 id="repo">Design canvas</h1>
  <div class="seg" role="group" aria-label="Layout">
    <button type="button" data-view="grid" class="on" aria-pressed="true">Areas</button>
    <button type="button" data-view="flow" aria-pressed="false">Flows</button>
  </div>
  <label class="search"><span class="sr">Search screens</span><input id="q" type="search" placeholder="Search screens"></label>
  <details class="filters" id="filters">
    <summary>Filter <span id="fcount" class="count" hidden></span></summary>
    <div class="pop">
      <label>Area <select id="area"><option value="">All</option></select></label>
      <label>Workflow <select id="workflow"><option value="">All</option></select></label>
      <label class="chk"><input type="checkbox" id="open"> Only screens with open comments</label>
      <label class="chk"><input type="checkbox" id="failing"> Only screens with failing checks</label>
    </div>
  </details>
  <nav class="tabs" aria-label="Panels">
    <button type="button" data-panel="cards">Cards</button>
    <button type="button" data-panel="decisions">Decisions</button>
    <button type="button" data-panel="tokens">Tokens</button>
    <button type="button" data-panel="references">References</button>
    <button type="button" data-panel="explore">Explore</button>
  </nav>
</header>
<main id="stage" aria-label="Screens">
  <div id="board"><svg id="edges" aria-hidden="true"></svg></div>
</main>
<div class="dock" role="toolbar" aria-label="View">
  <label class="pick"><span class="sr">Viewport</span><select id="viewport"></select></label>
  <div class="seg states" id="states" role="group" aria-label="State"></div>
  <button type="button" id="arrange" class="btn quiet" hidden>Arrange</button>
  <div class="zoom" role="group" aria-label="Zoom">
    <button type="button" id="zout" aria-label="Zoom out">−</button>
    <output id="zval">100%</output>
    <button type="button" id="zin" aria-label="Zoom in">+</button>
    <button type="button" id="zfit">Fit</button>
  </div>
</div>
<aside id="panel" hidden aria-live="polite"></aside>
<div id="focus" hidden role="dialog" aria-modal="true" aria-label="Screen"></div>
<div id="status" role="status"></div>
<script src="/canvas/canvas.js"></script>
</body>
</html>
